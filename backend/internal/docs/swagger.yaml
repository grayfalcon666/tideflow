  /api/v1/users/me/username:
    put:
      consumes:
      - application/json
      description: 修改当前用户的用户名
      parameters:
      - description: 新用户名
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateUsernameRequest'
      produces:
