        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - OAuth2Password: []
      summary: 获取消息记录
      tags:
      - 私信
  /api/v1/messages/conversations/{user_id}/read:
    put:
      description: 标记与指定用户的会话为已读
      parameters:
      - description: 用户ID
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - OAuth2Password: []
      summary: 标记会话已读
      tags:
      - 私信
  /api/v1/notifications:
    get:
      description: 获取当前用户的通知列表
      parameters:
      - description: 游标
        in: query
        name: cursor
        type: string
      - default: 20
        description: 每页数量
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.PageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - OAuth2Password: []
      summary: 通知列表
      tags:
      - 通知
  /api/v1/notifications/read:
    put:
      consumes:
      - application/json
      description: 标记通知为已读，传入IDs只标记指定通知，不传或空数组标记全部
      parameters:
      - description: 通知ID列表
        in: body
        name: body
        schema:
          $ref: '#/definitions/handler.MarkReadRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - OAuth2Password: []
      summary: 标记通知已读
      tags:
      - 通知
  /api/v1/notifications/stream:
    get:
      description: 建立SSE连接，接收实时通知推送
      parameters:
      - description: 访问令牌
        in: query
        name: token
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE事件流
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - OAuth2Password: []
      summary: SSE实时通知
      tags:
      - 通知
  /api/v1/notifications/unread-count:
    get:
      description: 获取当前用户未读通知的数量
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - OAuth2Password: []
      summary: 未读通知数
      tags:
      - 通知
  /api/v1/tags/hot:
    get:
      description: 获取当前热门标签列表
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 热门标签
      tags:
      - 标签
  /api/v1/users/{id}:
    get:
      description: 通过用户ID获取用户公开信息
      parameters:
      - description: 用户ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      summary: 获取指定用户信息
      tags:
      - 用户资料
  /api/v1/users/{id}/followers:
    get:
      description: 获取指定用户的粉丝列表
      parameters:
      - description: 用户ID
