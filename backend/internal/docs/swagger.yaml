definitions:
  internal_handler.ChangePasswordRequest:
    properties:
      new_password:
        maxLength: 128
        minLength: 6
        type: string
      old_password:
        type: string
      username:
        type: string
    required:
    - new_password
    - old_password
    - username
    type: object
  internal_handler.CreateNoteRequest:
    properties:
      content:
        type: string
      timestamp:
        type: number
    required:
    - content
    - timestamp
    type: object
  internal_handler.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  internal_handler.MarkReadRequest:
    properties:
      ids:
        items:
          type: integer
        type: array
    type: object
  internal_handler.OAuth2TokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      token_type:
        type: string
    type: object
  internal_handler.PublishCommentRequest:
    properties:
      content:
        type: string
      parent_id:
        type: integer
      root_id:
        type: integer
    required:
    - content
    type: object
  internal_handler.PublishVideoRequest:
    properties:
      cover_url:
        type: string
      description:
        type: string
      play_url:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
    required:
    - cover_url
    - play_url
    - title
    type: object
  internal_handler.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  internal_handler.RegisterRequest:
    properties:
      password:
        maxLength: 128
        minLength: 6
        type: string
      username:
        maxLength: 30
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  internal_handler.SendMessageRequest:
    properties:
      content:
        type: string
      to_id:
        type: integer
    required:
    - content
    - to_id
    type: object
  internal_handler.UpdateProfileRequest:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
    type: object
  internal_handler.UpdateUsernameRequest:
    properties:
      username:
        maxLength: 30
        minLength: 3
        type: string
    required:
    - username
    type: object
  internal_handler.UpdateVideoRequest:
    properties:
      cover_url:
        type: string
      description:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  tideflow_internal_service.CaptionEntry:
    properties:
      content:
        type: string
      end:
        type: string
      start:
        type: string
    type: object
  tideflow_internal_service.CommitReq:
    properties:
      result:
        description: '"correct" or "wrong"'
        type: string
      word:
        type: string
    type: object
  tideflow_internal_service.CommitResp:
    properties:
      batch_remaining:
        type: integer
      daily_words_today:
        type: integer
      new_status:
        type: integer
    type: object
  tideflow_internal_service.DailyHeatmapEntry:
    properties:
      date:
        type: string
      words_count:
        type: integer
    type: object
  tideflow_internal_service.HabitStatsResp:
    properties:
      current_streak:
        type: integer
      heatmap:
        items:
          $ref: '#/definitions/tideflow_internal_service.DailyHeatmapEntry'
        type: array
      today_videos:
        type: integer
      today_words:
        type: integer
      total_days:
        type: integer
    type: object
  tideflow_internal_service.LearnWordsResp:
    properties:
      batch_remaining:
        type: integer
      batch_total:
        type: integer
      daily_remaining:
        description: nil for type mode
        type: integer
      words:
        items:
          $ref: '#/definitions/tideflow_internal_service.LearningWord'
        type: array
    type: object
  tideflow_internal_service.LearningWord:
    properties:
      definition:
        type: string
      first_caption_start:
        type: string
      pos:
        type: string
      translation:
        type: string
      ukphone:
        type: string
      usphone:
        type: string
      value:
        type: string
    type: object
  tideflow_internal_service.WordCaptionsResponse:
    properties:
      captions:
        items:
          $ref: '#/definitions/tideflow_internal_service.CaptionEntry'
        type: array
      word:
        type: string
    type: object
  tideflow_internal_service.WordbankResponse:
    properties:
      size:
        type: integer
      video_id:
        type: integer
      words:
        items:
          type: integer
        type: array
    type: object
  tideflow_pkg_response.PageResponse:
    properties:
      has_more:
        type: boolean
      items: {}
      next_cursor:
        type: string
    type: object
  tideflow_pkg_response.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  tideflow_pkg_response.SearchResponse:
    properties:
      has_more:
        type: boolean
      items: {}
      next_cursor:
        type: string
      page:
        type: integer
      size:
        type: integer
      total:
        type: integer
    type: object
  tideflow_pkg_response.TokenResponse:
    properties:
      access_token:
        type: string
      account_id:
        type: integer
      expires_in:
        type: integer
      refresh_token:
        type: string
    type: object
info:
  contact: {}
  description: 高性能短视频 Feed 流系统 API 文档
  termsOfService: http://swagger.io/terms/
  title: TideFlow 短视频 Feed 流 API
  version: v1
paths:
  /api/v1/admin/vocab/import:
    post:
      description: 扫描 VOCAB_LISTS_DIR 下的 .txt 文件并导入到 MySQL，然后重新加载内存缓存
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
      security:
      - OAuth2Password: []
      summary: 导入考纲词表
      tags:
      - 管理
  /api/v1/admin/vocab/reload:
    post:
      description: 从 MySQL 重新加载考纲词表到进程内存
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
      security:
      - OAuth2Password: []
      summary: 重载考纲词表缓存
      tags:
      - 管理
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: 使用用户名密码登录，返回access_token和refresh_token
      parameters:
      - description: 登录信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tideflow_pkg_response.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
      summary: 用户登录
      tags:
      - 认证
  /api/v1/auth/logout:
    post:
      description: 使当前access_token失效
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
      security:
      - OAuth2Password: []
      summary: 用户登出
      tags:
      - 认证
  /api/v1/auth/oauth2/token:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Swagger UI登录专用端点，使用username/password换取access_token
      parameters:
      - description: 用户名
        in: formData
        name: username
        required: true
        type: string
      - description: 密码
        in: formData
        name: password
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.OAuth2TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
      summary: OAuth2 Token (Swagger专用)
      tags:
      - 认证
  /api/v1/auth/password:
    post:
      consumes:
      - application/json
      description: 用户修改密码，需要提供旧密码验证
      parameters:
      - description: 密码修改信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
      summary: 修改密码
      tags:
      - 认证
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: 使用refresh_token获取新的access_token和refresh_token
      parameters:
      - description: 刷新令牌
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tideflow_pkg_response.TokenResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
      summary: 刷新令牌
      tags:
      - 认证
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: 注册新用户，返回access_token和refresh_token
      parameters:
      - description: 注册信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/tideflow_pkg_response.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
      summary: 用户注册
      tags:
      - 认证
  /api/v1/feed/following:
    get:
      description: 获取当前用户关注的人的发布视频
      parameters:
      - description: 游标
        in: query
        name: cursor
        type: string
      - default: 20
        description: 每页数量
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tideflow_pkg_response.PageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
      security:
      - OAuth2Password: []
      summary: 关注流
      tags:
      - 时间线
  /api/v1/feed/latest:
    get:
      description: 获取全局最新视频列表，按时间倒序
      parameters:
      - description: 游标
        in: query
        name: cursor
        type: string
      - default: 20
        description: 每页数量
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tideflow_pkg_response.PageResponse'
      summary: 全局最新Feed
      tags:
      - 时间线
  /api/v1/feed/popular:
    get:
      description: 获取热门视频列表，按热度降序
      parameters:
      - default: "0"
        description: 偏移量游标
        in: query
        name: cursor
        type: string
      - default: 20
        description: 每页数量
        in: query
        name: limit
        type: integer
      - default: 1h
        description: 时间窗口
        in: query
        name: window
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tideflow_pkg_response.PageResponse'
      summary: 热门榜单
      tags:
      - 时间线
  /api/v1/feed/tag:
    get:
      description: 通过标签搜索视频列表
      parameters:
      - description: 标签名
        in: query
        name: tag
        required: true
        type: string
      - description: 游标
        in: query
        name: cursor
        type: string
      - default: 20
        description: 每页数量
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tideflow_pkg_response.PageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
      summary: 按标签搜索视频
      tags:
      - 时间线
  /api/v1/history:
    delete:
      description: 清空当前用户的所有观看历史
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
      security:
      - OAuth2Password: []
      summary: 清空观看历史
      tags:
      - 视频
    get:
      description: 分页获取当前用户的观看历史
      parameters:
      - description: 游标
        in: query
        name: cursor
        type: string
      - default: 20
        description: 每页数量
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tideflow_pkg_response.PageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
      security:
      - OAuth2Password: []
      summary: 获取观看历史
      tags:
      - 视频
  /api/v1/history/{video_id}:
    delete:
      description: 删除指定视频的观看历史
      parameters:
      - description: 视频ID
        in: path
        name: video_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
      security:
      - OAuth2Password: []
      summary: 删除单条观看记录
      tags:
      - 视频
  /api/v1/history/record:
    post:
      consumes:
      - application/json
      description: 记录观看历史（30分钟去重）
      parameters:
      - description: '{video_id}'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
      security:
      - OAuth2Password: []
      summary: 记录观看历史
      tags:
      - 视频
  /api/v1/learn/batch/abort:
    post:
      description: 删除当前活跃的学习队列和批次信息，已提交的单词状态不受影响
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
      security:
      - OAuth2Password: []
      summary: 放弃当前学习批次
      tags:
      - 学习
  /api/v1/learn/commit:
    post:
      description: 提交一个单词的拼写结果（correct/wrong），更新星级和队列
      parameters:
      - description: 单词提交数据
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/tideflow_internal_service.CommitReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tideflow_internal_service.CommitResp'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
      security:
      - OAuth2Password: []
      summary: 提交单个单词拼写结果
      tags:
      - 学习
  /api/v1/learn/habit/stats:
    get:
      description: 返回指定年份的热力图数据、打卡天数和连续打卡天数
      parameters:
      - description: 年份
        in: query
        name: year
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tideflow_internal_service.HabitStatsResp'
      security:
      - OAuth2Password: []
      summary: 获取学习习惯统计
      tags:
      - 学习
  /api/v1/learn/lists:
    get:
      description: 返回所有预置的考纲词表（如四级、六级等）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
      security:
      - OAuth2Password: []
      summary: 获取考纲词表列表
      tags:
      - 学习
  /api/v1/learn/today/words:
    get:
      description: 返回用户今天学习的所有单词及其星级
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
      security:
      - OAuth2Password: []
      summary: 获取今日学习的单词
      tags:
      - 学习
  /api/v1/likes/mine:
    get:
      description: 获取当前用户点赞过的视频列表
      parameters:
      - description: 游标
        in: query
        name: cursor
        type: string
      - default: 20
        description: 每页数量
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tideflow_pkg_response.PageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
      security:
      - OAuth2Password: []
      summary: 我点赞过的视频
      tags:
      - 互动
  /api/v1/messages:
    post:
      consumes:
      - application/json
      description: 向指定用户发送私信
      parameters:
      - description: 私信内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.SendMessageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
      security:
      - OAuth2Password: []
      summary: 发送私信
      tags:
      - 私信
  /api/v1/messages/conversations:
    get:
      description: 获取当前用户的会话列表
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
      security:
      - OAuth2Password: []
      summary: 会话列表
      tags:
      - 私信
  /api/v1/messages/conversations/{user_id}:
    get:
      description: 获取与指定用户的聊天记录
      parameters:
      - description: 用户ID
        in: path
        name: user_id
        required: true
        type: integer
      - description: 游标
        in: query
        name: cursor
        type: string
      - default: 20
        description: 每页数量
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tideflow_pkg_response.PageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
      security:
      - OAuth2Password: []
      summary: 获取消息记录
      tags:
      - 私信
  /api/v1/messages/conversations/{user_id}/read:
    put:
      description: 标记与指定用户的会话为已读
      parameters:
      - description: 用户ID
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/tideflow_pkg_response.Response'
      security:
      - OAuth2Password: []
      summary: 标记会话已读
      tags:
      - 私信
  /api/v1/messages/share-video:
    post:
      consumes:
      - application/json
      description: 将视频预览消息批量发送给指定好友
      parameters:
      - description: 视频分享请求
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
