definitions:
  handler.ChangePasswordRequest:
    properties:
      new_password:
        maxLength: 128
        minLength: 6
        type: string
      old_password:
        type: string
      username:
        type: string
    required:
    - new_password
    - old_password
    - username
    type: object
  handler.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  handler.MarkReadRequest:
    properties:
      ids:
        items:
          type: integer
        type: array
    type: object
  handler.OAuth2TokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      token_type:
        type: string
    type: object
  handler.PublishCommentRequest:
    properties:
      content:
        type: string
      parent_id:
        type: integer
      root_id:
        type: integer
    required:
    - content
    type: object
  handler.PublishVideoRequest:
    properties:
      cover_url:
        type: string
      description:
        type: string
      play_url:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
    required:
    - cover_url
    - play_url
    - title
    type: object
  handler.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handler.RegisterRequest:
    properties:
      password:
        maxLength: 128
        minLength: 6
        type: string
      username:
        maxLength: 30
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  handler.SendMessageRequest:
    properties:
      content:
        type: string
      to_id:
        type: integer
    required:
    - content
    - to_id
    type: object
  handler.UpdateProfileRequest:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
    type: object
  handler.UpdateUsernameRequest:
    properties:
      username:
        maxLength: 30
        minLength: 3
        type: string
    required:
    - username
    type: object
  handler.UpdateVideoRequest:
    properties:
      cover_url:
        type: string
      description:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  response.PageResponse:
    properties:
      has_more:
        type: boolean
      items: {}
      next_cursor:
        type: string
    type: object
  response.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  response.TokenResponse:
    properties:
      access_token:
        type: string
      account_id:
        type: integer
      expires_in:
        type: integer
      refresh_token:
        type: string
    type: object
info:
  contact: {}
  description: 高性能短视频 Feed 流系统 API 文档
  termsOfService: http://swagger.io/terms/
  title: TideFlow 短视频 Feed 流 API
  version: v1
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: 使用用户名密码登录，返回access_token和refresh_token
      parameters:
      - description: 登录信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      summary: 用户登录
      tags:
      - 认证
  /api/v1/auth/logout:
    post:
      description: 使当前access_token失效
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - OAuth2Password: []
      summary: 用户登出
      tags:
      - 认证
  /api/v1/auth/oauth2/token:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Swagger UI登录专用端点，使用username/password换取access_token
      parameters:
      - description: 用户名
        in: formData
        name: username
        required: true
        type: string
      - description: 密码
        in: formData
        name: password
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.OAuth2TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      summary: OAuth2 Token (Swagger专用)
      tags:
      - 认证
  /api/v1/auth/password:
    post:
      consumes:
      - application/json
      description: 用户修改密码，需要提供旧密码验证
      parameters:
      - description: 密码修改信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      summary: 修改密码
      tags:
      - 认证
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: 使用refresh_token获取新的access_token和refresh_token
      parameters:
      - description: 刷新令牌
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.TokenResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      summary: 刷新令牌
      tags:
      - 认证
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: 注册新用户，返回access_token和refresh_token
      parameters:
      - description: 注册信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Response'
      summary: 用户注册
      tags:
      - 认证
  /api/v1/feed/following:
    get:
      description: 获取当前用户关注的人的发布视频
      parameters:
      - description: 游标
        in: query
        name: cursor
        type: string
      - default: 20
        description: 每页数量
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.PageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - OAuth2Password: []
      summary: 关注流
      tags:
      - 时间线
  /api/v1/feed/latest:
    get:
      description: 获取全局最新视频列表，按时间倒序
      parameters:
      - description: 游标
        in: query
        name: cursor
        type: string
      - default: 20
        description: 每页数量
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.PageResponse'
      summary: 全局最新Feed
      tags:
      - 时间线
  /api/v1/feed/popular:
    get:
      description: 获取热门视频列表，按热度降序
      parameters:
      - default: "0"
        description: 偏移量游标
        in: query
        name: cursor
        type: string
      - default: 20
        description: 每页数量
        in: query
        name: limit
        type: integer
      - default: 1h
        description: 时间窗口
        in: query
        name: window
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.PageResponse'
      summary: 热门榜单
      tags:
      - 时间线
  /api/v1/feed/tag:
    get:
      description: 通过标签搜索视频列表
      parameters:
      - description: 标签名
        in: query
        name: tag
        required: true
        type: string
      - description: 游标
        in: query
        name: cursor
        type: string
      - default: 20
        description: 每页数量
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.PageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      summary: 按标签搜索视频
      tags:
      - 时间线
  /api/v1/likes/mine:
    get:
      description: 获取当前用户点赞过的视频列表
      parameters:
      - description: 游标
        in: query
        name: cursor
        type: string
      - default: 20
        description: 每页数量
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.PageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - OAuth2Password: []
      summary: 我点赞过的视频
      tags:
      - 互动
  /api/v1/messages:
    post:
      consumes:
      - application/json
      description: 向指定用户发送私信
      parameters:
      - description: 私信内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.SendMessageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - OAuth2Password: []
      summary: 发送私信
      tags:
      - 私信
  /api/v1/messages/conversations:
    get:
      description: 获取当前用户的会话列表
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - OAuth2Password: []
      summary: 会话列表
      tags:
      - 私信
  /api/v1/messages/conversations/{user_id}:
    get:
      description: 获取与指定用户的聊天记录
      parameters:
      - description: 用户ID
        in: path
        name: user_id
        required: true
        type: integer
      - description: 游标
        in: query
        name: cursor
        type: string
      - default: 20
        description: 每页数量
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
